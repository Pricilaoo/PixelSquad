name: Build, release and publish PixelSquad

on:
  push:
    branches: [main]
    paths: ['extension/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Auto-bump patch version when needed
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { execSync } = require('child_process');

          const manifestPath = 'extension/manifest.json';
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          const current = manifest.version.split('.').map(Number);
          const tags = execSync("git tag --sort=-v:refname", {encoding: 'utf8'})
            .split('\n')
            .map(x => x.trim())
            .filter(x => /^v\d+(\.\d+){0,3}$/.test(x));

          if (tags.length) {
            const latest = tags[0].slice(1).split('.').map(Number);
            while (current.length < 4) current.push(0);
            while (latest.length < 4) latest.push(0);

            const currentN = current[0]*1e9 + current[1]*1e6 + current[2]*1e3 + current[3];
            const latestN = latest[0]*1e9 + latest[1]*1e6 + latest[2]*1e3 + latest[3];

            if (currentN <= latestN) {
              current[3] += 1;
              manifest.version = current.join('.');
              fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n');
              console.log('Version bumped to', manifest.version);
            }
          }
          NODE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- extension/manifest.json; then
            echo "Version already newer than the latest release."
          else
            git add extension/manifest.json
            git commit -m "chore: bump PixelSquad version [skip ci]"
            git push origin HEAD:main
          fi

      - name: Validate manifest
        run: node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json','utf8')); console.log('manifest OK')"

      - name: Validate JavaScript
        run: |
          node --check extension/locales.js
          node --check extension/content.js
          node --check extension/popup.js
          node --check extension/toolsblet-importer.js

      - name: Install CRX builder
        run: npm install --no-save crx3@2

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./extension/manifest.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "PixelSquad version: $VERSION"

      - name: Prepare signing key
        env:
          PIXELSQUAD_PRIVATE_KEY_B64: ${{ secrets.PIXELSQUAD_PRIVATE_KEY_B64 }}
        run: |
          test -n "$PIXELSQUAD_PRIVATE_KEY_B64" || {
            echo "Missing repository secret PIXELSQUAD_PRIVATE_KEY_B64"
            exit 1
          }
          printf '%s' "$PIXELSQUAD_PRIVATE_KEY_B64" | base64 --decode > /tmp/pixelsquad-key.pem
          chmod 600 /tmp/pixelsquad-key.pem

      - name: Build CRX3, ZIP and update manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          CRX_URL="https://github.com/Pricilaoo/PixelSquad/releases/latest/download/PixelSquad-latest.crx"

          npx crx3 extension \
            --key /tmp/pixelsquad-key.pem \
            --crx "PixelSquad-$VERSION.crx" \
            --zip "PixelSquad-$VERSION.zip" \
            --xml "PixelSquad-update.xml" \
            --appVersion "$VERSION" \
            --crxURL "$CRX_URL"

          cp "PixelSquad-$VERSION.crx" PixelSquad-latest.crx
          mkdir -p updates
          cp "PixelSquad-update.xml" updates/update.xml

          test -s "PixelSquad-$VERSION.crx"
          test -s "PixelSquad-$VERSION.zip"
          test -s PixelSquad-latest.crx
          test -s updates/update.xml

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: PixelSquad v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            PixelSquad-${{ steps.version.outputs.version }}.crx
            PixelSquad-${{ steps.version.outputs.version }}.zip
            PixelSquad-latest.crx

      - name: Publish update.xml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/update.xml
          if git diff --cached --quiet; then
            echo "update.xml already current"
          else
            git commit -m "chore: publish PixelSquad update manifest [skip ci]"
            git push origin HEAD:main
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelSquad-v${{ steps.version.outputs.version }}
          path: |
            PixelSquad-${{ steps.version.outputs.version }}.crx
            PixelSquad-${{ steps.version.outputs.version }}.zip
            PixelSquad-latest.crx
            updates/update.xml
