name: Build and validate PixelSquad
on:
  push:
    branches: [main]
    paths: ['extension/**']
  workflow_dispatch:
jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest
        run: node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json','utf8')); console.log('manifest OK')"
      - name: Validate JavaScript
        run: |
          node --check extension/locales.js
          node --check extension/content.js
          node --check extension/popup.js
          node --check extension/toolsblet-importer.js
      - name: Create extension ZIP
        run: cd extension && zip -r ../PixelSquad-latest.zip . -x '*.DS_Store'
      - uses: actions/upload-artifact@v4
        with:
          name: PixelSquad-latest
          path: PixelSquad-latest.zip
