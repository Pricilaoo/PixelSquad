name: Build PixelSquad
on:
  push:
    branches: [main]
    paths: ['extension/**']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create extension ZIP
        run: cd extension && zip -r ../PixelSquad-latest.zip . -x '*.DS_Store'
      - uses: actions/upload-artifact@v4
        with:
          name: PixelSquad-latest
          path: PixelSquad-latest.zip
