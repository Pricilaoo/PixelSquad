name: Validate PixelSquad item catalogs

on:
  push:
    branches: ['draft/handitems-cleanup-05315', 'draft/creator-pixel-05316']
    paths:
      - 'extension/**'
      - 'tests/**'
      - 'services/vision/**'
      - 'referencias/html/**'
      - '.github/workflows/validate-item-catalog.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout draft
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript syntax
        run: |
          for file in extension/*.js tests/*.cjs services/vision/*.mjs; do
            node --check "$file"
          done
      - name: Install test dependencies
        run: npm install --prefix tests --ignore-scripts --no-audit --no-fund
      - name: Validate UI, catalogs and existing features
        run: npm test --prefix tests
      - name: Validate controls, chat and creator in Chrome
        run: npm run test:browser --prefix tests
      - name: Save panel previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PixelSquad-controls-preview
          path: /tmp/pixelsquad-controls/
          if-no-files-found: ignore

      - name: Save local AI configurator
        uses: actions/upload-artifact@v4
        with:
          name: PixelSquad-IA-configurador
          path: |
            services/vision/server.mjs
            services/vision/setup.mjs
            services/vision/INICIAR-IA.cmd
            services/vision/README.md
          if-no-files-found: error
